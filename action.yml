name: asc-request
description: Headless App Store Connect API request via an ES256-signed JWT from a .p8 key.
author: Edoworks
branding:
  icon: key
  color: blue
inputs:
  method:
    description: HTTP method (GET, POST, PATCH, DELETE)
    required: true
  path:
    description: ASC API path, e.g. /v1/apps?limit=5
    required: true
  body:
    description: Optional JSON request body
    required: false
    default: ""
  key_path:
    description: Absolute path to the AuthKey_<id>.p8 key (supply from secrets)
    required: true
  issuer_id:
    description: App Store Connect issuer UUID (supply from secrets)
    required: true
  key_id:
    description: Key id (optional; derived from the AuthKey_<id>.p8 filename)
    required: false
    default: ""
outputs:
  status:
    description: HTTP status code
    value: ${{ steps.req.outputs.status }}
runs:
  using: composite
  steps:
    - id: req
      shell: bash
      env:
        ASC_KEY_PATH: ${{ inputs.key_path }}
        ASC_ISSUER_ID: ${{ inputs.issuer_id }}
        ASC_KEY_ID: ${{ inputs.key_id }}
      run: |
        BODY_ARG=""
        if [ -n "${{ inputs.body }}" ]; then BODY_ARG="--body '${{ inputs.body }}'"; fi
        node "$GITHUB_ACTION_PATH/asc-cli.mjs" request \
          --method "${{ inputs.method }}" \
          --path "${{ inputs.path }}" \
          $BODY_ARG
